name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.lambda'
  workflow_dispatch:
    inputs:
      deploy_presign:
        description: Deploy the presign Lambda
        type: boolean
        required: false
        default: true
      deploy_renderer:
        description: Deploy the renderer Lambda
        type: boolean
        required: false
        default: true

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT: '165044447372'
  ECR_REPO: paperless-be

jobs:
  deploy-presign:
    name: Deploy presign Lambda
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_presign
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy presign handler
        run: |
          mkdir -p presign-package
          # LAMBDA_PYTHON must match the presign Lambda's configured runtime.
          # Check: aws lambda get-function-configuration --function-name paperless-presign --query Runtime
          LAMBDA_PYTHON=3.11
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version $LAMBDA_PYTHON \
            --only-binary=:all: \
            -r backend/requirements-presign.txt \
            -t presign-package/
          cp backend/presign_handler.py backend/docx_writer.py backend/docx_node_ids.py backend/docx_ast.py backend/field_extractor.py presign-package/
          (cd presign-package && zip -r ../presign.zip .)
          aws lambda update-function-code \
            --function-name paperless-presign \
            --zip-file fileb://presign.zip \
            --region $AWS_REGION
          aws lambda wait function-updated \
            --function-name paperless-presign \
            --region $AWS_REGION

  deploy-renderer:
    name: Deploy renderer Lambda
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_renderer
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        run: |
          IMAGE_URI=$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            -f Dockerfile.lambda \
            -t $IMAGE_URI .

      - name: Update Lambda
        run: |
          IMAGE_URI=$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
          aws lambda update-function-code \
            --function-name paperless-renderer \
            --image-uri $IMAGE_URI \
            --region $AWS_REGION
          aws lambda wait function-updated \
            --function-name paperless-renderer \
            --region $AWS_REGION
